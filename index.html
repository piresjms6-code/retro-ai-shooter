<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List - Local Storage</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --primary: #60a5fa;
        --primary-2: #38bdf8;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --success: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        --border: rgba(148, 163, 184, 0.2);
        --shadow: rgba(15, 23, 42, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #020817, #0b1120 55%, #111827);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .app {
        width: min(100%, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 26px 50px var(--shadow);
        overflow: hidden;
      }

      .header {
        padding: 26px 24px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.12), rgba(56, 189, 248, 0.06));
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        letter-spacing: 0.06em;
      }

      .header p {
        margin: 0;
        color: var(--muted);
      }

      .input-row {
        display: flex;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
      }

      input[type="text"] {
        flex: 1;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="text"]:focus {
        border-color: rgba(96, 165, 250, 0.8);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #08101d;
      }

      .secondary-btn {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
      }

      .danger-btn {
        background: rgba(248, 113, 113, 0.12);
        color: var(--danger);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 24px 10px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: rgba(148, 163, 184, 0.08);
        color: var(--muted);
        padding: 10px 14px;
      }

      .filter-btn.active {
        background: rgba(96, 165, 250, 0.18);
        color: var(--text);
        border: 1px solid rgba(96, 165, 250, 0.45);
      }

      .stats {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .todo-list {
        list-style: none;
        margin: 0;
        padding: 0 24px 24px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(31, 41, 55, 0.7);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 12px;
        margin-top: 12px;
        transition: border-color 0.2s ease, transform 0.15s ease;
      }

      .todo-item:hover {
        border-color: rgba(96, 165, 250, 0.45);
      }

      .todo-check {
        width: 20px;
        height: 20px;
        accent-color: var(--success);
        cursor: pointer;
      }

      .todo-text {
        flex: 1;
        font-size: 1rem;
        word-break: break-word;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .delete-btn {
        background: transparent;
        color: var(--danger);
        font-size: 1.2rem;
        padding: 8px 10px;
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 32px 16px 8px;
      }

      @media (max-width: 560px) {
        .input-row {
          flex-direction: column;
        }

        .toolbar {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Todo List</h1>
        <p>Keep track of your tasks and save them automatically.</p>
      </div>

      <div class="input-row">
        <input id="taskInput" type="text" maxlength="200" placeholder="Add a new task..." aria-label="New task" />
        <button id="addTaskBtn" class="primary-btn" type="button">Add</button>
      </div>

      <div class="toolbar">
        <div class="filters" aria-label="Filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
        <div class="stats" id="stats">0 tasks left</div>
      </div>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>
    </div>

    <script>
      const STORAGE_KEY = 'todo-list-items-v1';
      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const todoList = document.getElementById('todoList');
      const statsEl = document.getElementById('stats');
      const filterButtons = document.querySelectorAll('.filter-btn');

      let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let currentFilter = 'all';

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function updateStats() {
        const remaining = tasks.filter(task => !task.completed).length;
        statsEl.textContent = `${remaining} task${remaining === 1 ? '' : 's'} left`;
      }

      function render() {
        const filteredTasks = tasks.filter(task => {
          if (currentFilter === 'active') return !task.completed;
          if (currentFilter === 'completed') return task.completed;
          return true;
        });

        todoList.innerHTML = '';

        if (filteredTasks.length === 0) {
          const emptyState = document.createElement('li');
          emptyState.className = 'empty-state';
          emptyState.textContent = currentFilter === 'all'
            ? 'No tasks yet. Add one above!'
            : currentFilter === 'active'
              ? 'No active tasks.'
              : 'No completed tasks.';
          todoList.appendChild(emptyState);
          updateStats();
          return;
        }

        filteredTasks.forEach(task => {
          const item = document.createElement('li');
          item.className = `todo-item${task.completed ? ' completed' : ''}`;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.className = 'todo-check';
          checkbox.setAttribute('aria-label', `Mark ${task.text} complete`);
          checkbox.addEventListener('change', () => {
            task.completed = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = task.text;

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '×';
          deleteBtn.setAttribute('aria-label', `Delete ${task.text}`);
          deleteBtn.addEventListener('click', () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });

          item.appendChild(checkbox);
          item.appendChild(text);
          item.appendChild(deleteBtn);
          todoList.appendChild(item);
        });

        updateStats();
      }

      function addTask() {
        const value = taskInput.value.trim();
        if (!value) {
          taskInput.focus();
          return;
        }

        tasks.unshift({
          id: crypto.randomUUID(),
          text: value,
          completed: false
        });

        taskInput.value = '';
        taskInput.focus();
        saveTasks();
        render();
      }

      addTaskBtn.addEventListener('click', addTask);
      taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addTask();
      });

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          filterButtons.forEach(b => b.classList.toggle('active', b === btn));
          render();
        });
      });

      render();
    </script>
  </body>
</html>
